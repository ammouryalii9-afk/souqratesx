openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: vault
    description: SouqratesX game state operations
  - name: admin
    description: Admin control panel operations
  - name: config
    description: Public runtime configuration
  - name: earn
    description: Ads, offerwall, and survey reward operations
  - name: stars
    description: Telegram Stars purchases
  - name: telegram
    description: Telegram Bot webhook
  - name: ads
    description: Sponsored ad management and claiming
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/telegram:
    post:
      operationId: authTelegram
      tags: [auth]
      summary: Authenticate via Telegram WebApp initData
      description: Verifies Telegram WebApp initData, upserts the user, and sets a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramAuthInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSession"
        "401":
          description: Invalid Telegram authentication data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vault/me:
    get:
      operationId: getVaultMe
      tags: [vault]
      summary: Get the authenticated user's game state
      responses:
        "200":
          description: Current game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateVaultMe
      tags: [vault]
      summary: Save the authenticated user's game state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultStateUpdate"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vault/leaderboard:
    get:
      operationId: getVaultLeaderboard
      tags: [vault]
      summary: Get the global leaderboard sorted by lifetime points
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardEntryList"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Log in to the admin control panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Invalid admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Log out of the admin control panel
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Admin session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get aggregate platform stats
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List / search users
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Users page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{telegramId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get a single user's full record
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full user record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAdminUser
      tags: [admin]
      summary: Edit any field of a user's record (points, balance, ban status, premium, stars, notes, full state)
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserPatch"
      responses:
        "200":
          description: Updated user record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Permanently delete a user
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get all platform settings (economy tuning, ads, CPA/offerwalls, surveys, premium, Telegram Stars)
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsMap"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Bulk update platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsMap"
      responses:
        "200":
          description: Updated settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsMap"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
      summary: Get recent admin actions
      responses:
        "200":
          description: Recent admin actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{telegramId}/activity:
    get:
      operationId: getAdminUserActivity
      tags: [admin]
      summary: Get a unified timeline of everything a user has done (earnings, purchases, admin edits)
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserActivityList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/broadcast:
    get:
      operationId: getAdminBroadcasts
      tags: [admin]
      summary: List recent broadcast jobs and their progress
      responses:
        "200":
          description: Recent broadcast jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastJobList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminBroadcast
      tags: [admin]
      summary: Send a message to all (or a segment of) Telegram users via the bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastRequest"
      responses:
        "200":
          description: Broadcast job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastJob"
        "400":
          description: Invalid request or Telegram bot not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/broadcast/{id}:
    get:
      operationId: getAdminBroadcast
      tags: [admin]
      summary: Get the progress of a single broadcast job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Broadcast job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastJob"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Broadcast job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/telegram/setup-webhook:
    post:
      operationId: setupTelegramWebhook
      tags: [admin]
      summary: Point the Telegram bot's webhook at this server so Stars payments can be processed
      responses:
        "200":
          description: Webhook configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebhookSetupResult"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/ads:
    get:
      operationId: getAdminAds
      tags: [admin]
      summary: List all sponsored ads (active and inactive)
      responses:
        "200":
          description: Sponsored ads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsoredAdList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminAd
      tags: [admin]
      summary: Create a sponsored ad, optionally broadcasting it as a Telegram notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSponsoredAdBody"
      responses:
        "200":
          description: Sponsored ad created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsoredAd"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/ads/{id}:
    patch:
      operationId: updateAdminAd
      tags: [admin]
      summary: Update a sponsored ad (e.g. toggle active state)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSponsoredAdBody"
      responses:
        "200":
          description: Sponsored ad updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsoredAd"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ad not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminAd
      tags: [admin]
      summary: Delete a sponsored ad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ad deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /config/public:
    get:
      operationId: getPublicConfig
      tags: [config]
      summary: Get public, non-secret runtime configuration flags used to activate frontend features
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
  /ads:
    get:
      operationId: getAds
      tags: [ads]
      summary: List active sponsored ads for the current user, including whether each has already been claimed
      responses:
        "200":
          description: Active sponsored ads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAdList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ads/{id}/claim:
    post:
      operationId: claimAd
      tags: [ads]
      summary: Claim the one-time points reward for a sponsored ad (server-verified, once per user per ad)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reward credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarnRewardResult"
        "400":
          description: Ad not found, inactive, or already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /earn/adsgram/reward:
    post:
      operationId: claimAdsgramReward
      tags: [earn]
      summary: Credit points for a completed rewarded ad view (server-trusted cooldown + daily cap)
      responses:
        "200":
          description: Reward credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarnRewardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Cooldown active or daily cap reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /earn/adsgram/postback:
    get:
      operationId: adsgramPostback
      tags: [earn]
      summary: Server-to-server reward callback called by Adsgram when a rewarded ad view completes
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: secret
          in: query
          required: true
          schema:
            type: string
        - name: txId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarnRewardResult"
        "400":
          description: Missing or invalid params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid postback secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /earn/offerwall/postback:
    get:
      operationId: offerwallPostback
      tags: [earn]
      summary: Server-to-server postback endpoint called by CPA/offerwall/survey providers to credit a completed offer
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: telegramId
          in: query
          required: true
          schema:
            type: string
        - name: amount
          in: query
          required: true
          schema:
            type: number
        - name: secret
          in: query
          required: true
          schema:
            type: string
        - name: txId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarnRewardResult"
        "400":
          description: Invalid provider or missing params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid postback secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stars/invoice:
    post:
      operationId: createStarsInvoice
      tags: [stars]
      summary: Create a Telegram Stars invoice link for a purchasable product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarsInvoiceInput"
      responses:
        "200":
          description: Invoice link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarsInvoiceResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Unknown product or Stars purchases not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /telegram/webhook:
    post:
      operationId: telegramWebhook
      tags: [telegram]
      summary: Receives Telegram Bot API updates (pre_checkout_query, successful_payment) to process Stars purchases
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramWebhookUpdate"
      responses:
        "200":
          description: Update processed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    TelegramAuthInput:
      type: object
      properties:
        initData:
          type: string
          description: The raw initData string from window.Telegram.WebApp.initData
      required:
        - initData
    VaultUserProfile:
      type: object
      properties:
        telegramId:
          type: string
        username:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        lifetimePoints:
          type: integer
        referralCount:
          type: integer
        referralEarnings:
          type: integer
      required:
        - telegramId
        - username
        - firstName
        - lastName
        - photoUrl
        - lifetimePoints
        - referralCount
        - referralEarnings
    VaultStateData:
      type: object
      description: Freeform game state blob persisted for the user
      additionalProperties: true
    VaultStateUpdate:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/VaultStateData"
        lifetimePoints:
          type: integer
      required:
        - state
        - lifetimePoints
    VaultSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/VaultUserProfile"
        state:
          $ref: "#/components/schemas/VaultStateData"
      required:
        - user
        - state
    LeaderboardEntry:
      type: object
      properties:
        telegramId:
          type: string
        username:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        lifetimePoints:
          type: integer
      required:
        - telegramId
        - username
        - firstName
        - photoUrl
        - lifetimePoints
    LeaderboardEntryList:
      type: array
      items:
        $ref: "#/components/schemas/LeaderboardEntry"
    AdminLoginInput:
      type: object
      properties:
        password:
          type: string
      required:
        - password
    AdminSessionStatus:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalLifetimePoints:
          type: number
        totalBalanceUSD:
          type: number
        premiumUsers:
          type: integer
        bannedUsers:
          type: integer
        newUsersToday:
          type: integer
      required:
        - totalUsers
        - totalLifetimePoints
        - totalBalanceUSD
        - premiumUsers
        - bannedUsers
        - newUsersToday
    AdminUserSummary:
      type: object
      properties:
        telegramId:
          type: string
        username:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        lifetimePoints:
          type: integer
        isBanned:
          type: boolean
        isPremium:
          type: boolean
        starsBalance:
          type: integer
        referrerId:
          type: ["string", "null"]
        referralCount:
          type: integer
        referralEarnings:
          type: integer
        createdAt:
          type: string
      required:
        - telegramId
        - username
        - firstName
        - lastName
        - photoUrl
        - lifetimePoints
        - isBanned
        - isPremium
        - starsBalance
        - referrerId
        - referralCount
        - referralEarnings
        - createdAt
    AdminUserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummary"
        total:
          type: integer
      required:
        - users
        - total
    AdminUserDetail:
      type: object
      properties:
        telegramId:
          type: string
        username:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        lifetimePoints:
          type: integer
        isBanned:
          type: boolean
        isPremium:
          type: boolean
        premiumExpiresAt:
          type: ["string", "null"]
        starsBalance:
          type: integer
        referrerId:
          type: ["string", "null"]
        referralCount:
          type: integer
        referralEarnings:
          type: integer
        notes:
          type: ["string", "null"]
        state:
          $ref: "#/components/schemas/VaultStateData"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - telegramId
        - username
        - firstName
        - lastName
        - photoUrl
        - lifetimePoints
        - isBanned
        - isPremium
        - premiumExpiresAt
        - starsBalance
        - referrerId
        - referralCount
        - referralEarnings
        - notes
        - state
        - createdAt
        - updatedAt
    AdminUserPatch:
      type: object
      properties:
        lifetimePoints:
