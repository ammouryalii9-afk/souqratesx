openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: vault
    description: SouqratesX game state operations
  - name: admin
    description: Admin control panel operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/telegram:
    post:
      operationId: authTelegram
      tags: [auth]
      summary: Authenticate via Telegram WebApp initData
      description: Verifies Telegram WebApp initData, upserts the user, and sets a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramAuthInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSession"
        "401":
          description: Invalid Telegram authentication data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vault/me:
    get:
      operationId: getVaultMe
      tags: [vault]
      summary: Get the authenticated user's game state
      responses:
        "200":
          description: Current game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateVaultMe
      tags: [vault]
      summary: Save the authenticated user's game state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultStateUpdate"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vault/leaderboard:
    get:
      operationId: getVaultLeaderboard
      tags: [vault]
      summary: Get the global leaderboard sorted by lifetime points
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardEntryList"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Log in to the admin control panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Invalid admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Log out of the admin control panel
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Admin session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get aggregate platform stats
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List / search users
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Users page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{telegramId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get a single user's full record
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full user record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAdminUser
      tags: [admin]
      summary: Edit any field of a user's record (points, balance, ban status, premium, stars, notes, full state)
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserPatch"
      responses:
        "200":
          description: Updated user record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Permanently delete a user
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get all platform settings (economy tuning, ads, CPA/offerwalls, surveys, premium, Telegram Stars)
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsMap"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Bulk update platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsMap"
      responses:
        "200":
          description: Updated settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsMap"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
      summary: Get recent admin actions
      responses:
        "200":
          description: Recent admin actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    TelegramAuthInput:
      type: object
      properties:
        initData:
          type: string
          description: The raw initData string from window.Telegram.WebApp.initData
      required:
        - initData
    VaultUserProfile:
      type: object
      properties:
        telegramId:
          type: string
        username:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        lifetimePoints:
          type: integer
      required:
        - telegramId
        - username
        - firstName
        - lastName
        - photoUrl
        - lifetimePoints
    VaultStateData:
      type: object
      description: Freeform game state blob persisted for the user
      additionalProperties: true
    VaultStateUpdate:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/VaultStateData"
        lifetimePoints:
          type: integer
      required:
        - state
        - lifetimePoints
    VaultSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/VaultUserProfile"
        state:
          $ref: "#/components/schemas/VaultStateData"
      required:
        - user
        - state
    LeaderboardEntry:
      type: object
      properties:
        telegramId:
          type: string
        username:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        lifetimePoints:
          type: integer
      required:
        - telegramId
        - username
        - firstName
        - photoUrl
        - lifetimePoints
    LeaderboardEntryList:
      type: array
      items:
        $ref: "#/components/schemas/LeaderboardEntry"
    AdminLoginInput:
      type: object
      properties:
        password:
          type: string
      required:
        - password
    AdminSessionStatus:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated
    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalLifetimePoints:
          type: number
        totalBalanceUSD:
          type: number
        premiumUsers:
          type: integer
        bannedUsers:
          type: integer
        newUsersToday:
          type: integer
      required:
        - totalUsers
        - totalLifetimePoints
        - totalBalanceUSD
        - premiumUsers
        - bannedUsers
        - newUsersToday
    AdminUserSummary:
      type: object
      properties:
        telegramId:
          type: string
        username:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        lifetimePoints:
          type: integer
        isBanned:
          type: boolean
        isPremium:
          type: boolean
        starsBalance:
          type: integer
        createdAt:
          type: string
      required:
        - telegramId
        - username
        - firstName
        - lastName
        - photoUrl
        - lifetimePoints
        - isBanned
        - isPremium
        - starsBalance
        - createdAt
    AdminUserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummary"
        total:
          type: integer
      required:
        - users
        - total
    AdminUserDetail:
      type: object
      properties:
        telegramId:
          type: string
        username:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        lifetimePoints:
          type: integer
        isBanned:
          type: boolean
        isPremium:
          type: boolean
        premiumExpiresAt:
          type: ["string", "null"]
        starsBalance:
          type: integer
        notes:
          type: ["string", "null"]
        state:
          $ref: "#/components/schemas/VaultStateData"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - telegramId
        - username
        - firstName
        - lastName
        - photoUrl
        - lifetimePoints
        - isBanned
        - isPremium
        - premiumExpiresAt
        - starsBalance
        - notes
        - state
        - createdAt
        - updatedAt
    AdminUserPatch:
      type: object
      properties:
        lifetimePoints:
          type: integer
        isBanned:
          type: boolean
        isPremium:
          type: boolean
        premiumExpiresAt:
          type: ["string", "null"]
        starsBalance:
          type: integer
        notes:
          type: ["string", "null"]
        state:
          $ref: "#/components/schemas/VaultStateData"
    AdminSettingsMap:
      type: object
      description: Freeform key/value platform settings blob (economy tuning, ads, CPA/offerwalls, surveys, premium plans, Telegram Stars products)
      additionalProperties: true
    AdminAuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        targetTelegramId:
          type: ["string", "null"]
        details:
          type: object
          additionalProperties: true
        createdAt:
          type: string
      required:
        - id
        - action
        - targetTelegramId
        - details
        - createdAt
    AdminAuditLogList:
      type: array
      items:
        $ref: "#/components/schemas/AdminAuditLogEntry"
