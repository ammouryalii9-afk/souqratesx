openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: vault
    description: SouqratesX game state operations
  - name: admin
    description: Admin control panel operations
  - name: config
    description: Public runtime configuration
  - name: earn
    description: Ads, offerwall, and survey reward operations
  - name: stars
    description: Telegram Stars purchases
  - name: telegram
    description: Telegram Bot webhook
  - name: ads
    description: Sponsored ad management and claiming
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/telegram:
    post:
      operationId: authTelegram
      tags: [auth]
      summary: Authenticate via Telegram WebApp initData
      description: Verifies Telegram WebApp initData, upserts the user, and sets a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramAuthInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSession"
        "401":
          description: Invalid Telegram authentication data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vault/me:
    get:
      operationId: getVaultMe
      tags: [vault]
      summary: Get the authenticated user's game state
      responses:
        "200":
          description: Current game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateVaultMe
      tags: [vault]
      summary: Save the authenticated user's game state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultStateUpdate"
      responses:
        "200":
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSession"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vault/convert:
    post:
      operationId: convertSkpToSkx
      tags: [vault]
      summary: Convert SKP (soft mined points) into SKX (hard currency) at the admin-set rate; the remainder is burned
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertSkpBody"
      responses:
        "200":
          description: Updated game state after the conversion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertSkpResponse"
        "400":
          description: Invalid or insufficient SKP amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pixels/market:
    get:
      operationId: getPixelMarket
      tags: [pixels]
      summary: Get the active pixel cycle market (supply, tiers, current price, estimated dividend pool, my holdings)
      responses:
        "200":
          description: Market snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PixelMarket"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No active cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pixels/buy:
    post:
      operationId: buyPixels
      tags: [pixels]
      summary: Buy pixels in the active cycle with SKX (blended tier pricing, atomic supply + balance checks)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PixelPurchaseRequest"
      responses:
        "200":
          description: Purchase result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PixelPurchaseResult"
        "400":
          description: Invalid quantity, exceeds supply/limit, or insufficient SKX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No active cycle or cycle already ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /pixels/me:
    get:
      operationId: getMyPixels
      tags: [pixels]
      summary: Get my pixel holdings in the active cycle and my dividend payout history
      responses:
        "200":
          description: Holdings and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPixelsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /vault/leaderboard:
    get:
      operationId: getVaultLeaderboard
      tags: [vault]
      summary: Get the global leaderboard sorted by lifetime points
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardEntryList"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Log in to the admin control panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Invalid admin password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Log out of the admin control panel
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Check the current admin session
      responses:
        "200":
          description: Admin session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get aggregate platform stats
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List / search users
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Users page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{telegramId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get a single user's full record
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full user record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAdminUser
      tags: [admin]
      summary: Edit any field of a user's record (points, balance, ban status, premium, stars, notes, full state)
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserPatch"
      responses:
        "200":
          description: Updated user record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminUser
      tags: [admin]
      summary: Permanently delete a user
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Get all platform settings (economy tuning, ads, CPA/offerwalls, surveys, premium, Telegram Stars)
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsMap"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Bulk update platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsMap"
      responses:
        "200":
          description: Updated settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsMap"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/audit-log:
    get:
      operationId: getAdminAuditLog
      tags: [admin]
      summary: Get recent admin actions
      responses:
        "200":
          description: Recent admin actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuditLogList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/users/{telegramId}/activity:
    get:
      operationId: getAdminUserActivity
      tags: [admin]
      summary: Get a unified timeline of everything a user has done (earnings, purchases, admin edits)
      parameters:
        - name: telegramId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserActivityList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/broadcast:
    get:
      operationId: getAdminBroadcasts
      tags: [admin]
      summary: List recent broadcast jobs and their progress
      responses:
        "200":
          description: Recent broadcast jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastJobList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminBroadcast
      tags: [admin]
      summary: Send a message to all (or a segment of) Telegram users via the bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastRequest"
      responses:
        "200":
          description: Broadcast job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastJob"
        "400":
          description: Invalid request or Telegram bot not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/broadcast/{id}:
    get:
      operationId: getAdminBroadcast
      tags: [admin]
      summary: Get the progress of a single broadcast job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Broadcast job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastJob"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Broadcast job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/telegram/setup-webhook:
    post:
      operationId: setupTelegramWebhook
      tags: [admin]
      summary: Point the Telegram bot's webhook at this server so Stars payments can be processed
      responses:
        "200":
          description: Webhook configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebhookSetupResult"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/ads:
    get:
      operationId: getAdminAds
      tags: [admin]
      summary: List all sponsored ads (active and inactive)
      responses:
        "200":
          description: Sponsored ads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsoredAdList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminAd
      tags: [admin]
      summary: Create a sponsored ad, optionally broadcasting it as a Telegram notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSponsoredAdBody"
      responses:
        "200":
          description: Sponsored ad created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsoredAd"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/ads/{id}:
    patch:
      operationId: updateAdminAd
      tags: [admin]
      summary: Update a sponsored ad (e.g. toggle active state)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSponsoredAdBody"
      responses:
        "200":
          description: Sponsored ad updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsoredAd"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ad not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminAd
      tags: [admin]
      summary: Delete a sponsored ad
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ad deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/star-products:
    get:
      operationId: getAdminStarProducts
      tags: [admin]
      summary: List all Telegram Stars store products (active and inactive)
      responses:
        "200":
          description: Star products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarProductList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminStarProduct
      tags: [admin]
      summary: Create a new Telegram Stars store product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStarProductBody"
      responses:
        "200":
          description: Star product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarProduct"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/star-products/{id}:
    patch:
      operationId: updateAdminStarProduct
      tags: [admin]
      summary: Update a Telegram Stars store product (e.g. toggle active state, change price)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStarProductBody"
      responses:
        "200":
          description: Star product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarProduct"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminStarProduct
      tags: [admin]
      summary: Delete a Telegram Stars store product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionStatus"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /store/products:
    get:
      operationId: getStoreProducts
      tags: [stars]
      summary: List active Telegram Stars store products for the current user
      responses:
        "200":
          description: Active star products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarProductList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /config/public:
    get:
      operationId: getPublicConfig
      tags: [config]
      summary: Get public, non-secret runtime configuration flags used to activate frontend features
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
  /ads:
    get:
      operationId: getAds
      tags: [ads]
      summary: List active sponsored ads for the current user, including whether each has already been claimed
      responses:
        "200":
          description: Active sponsored ads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAdList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ads/{id}/start:
    post:
      operationId: startAd
      tags: [ads]
      summary: Record that the user opened a sponsored ad, starting the server-side minimum watch-time window required before it can be claimed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Watch window started (or already in progress)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdStartResult"
        "400":
          description: Ad not found, inactive, or already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ads/{id}/claim:
    post:
      operationId: claimAd
      tags: [ads]
      summary: Claim the one-time points reward for a sponsored ad (server-verified, once per user per ad, only after the minimum watch time has elapsed since /start)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reward credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarnRewardResult"
        "400":
          description: Ad not found, inactive, or already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Minimum watch time not yet elapsed, or ad was never started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /earn/offers:
    get:
      operationId: getEarnOffers
      tags: [earn]
      summary: Unified list of currently available earning opportunities across all enabled providers
      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarnOffersResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /earn/adsgram/reward:
    post:
      operationId: claimAdsgramReward
      tags: [earn]
      summary: Credit points for a completed rewarded ad view (server-trusted cooldown + daily cap)
      responses:
        "200":
          description: Reward credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarnRewardResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Cooldown active or daily cap reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /earn/adsgram/postback:
    get:
      operationId: adsgramPostback
      tags: [earn]
      summary: Server-to-server reward callback called by Adsgram when a rewarded ad view completes
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: secret
          in: query
          required: true
          schema:
            type: string
        - name: txId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarnRewardResult"
        "400":
          description: Missing or invalid params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid postback secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /earn/offerwall/postback:
    get:
      operationId: offerwallPostback
      tags: [earn]
      summary: Server-to-server postback endpoint called by CPA/offerwall/survey providers to credit a completed offer
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: telegramId
          in: query
          required: true
          schema:
            type: string
        - name: amount
          in: query
          required: true
          schema:
            type: number
        - name: secret
          in: query
          required: true
          schema:
            type: string
        - name: txId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarnRewardResult"
        "400":
          description: Invalid provider or missing params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Invalid postback secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stars/invoice:
    post:
      operationId: createStarsInvoice
      tags: [stars]
      summary: Create a Telegram Stars invoice link for a purchasable product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StarsInvoiceInput"
      responses:
        "200":
          description: Invoice link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StarsInvoiceResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Unknown product or Stars purchases not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /telegram/webhook:
    post:
      operationId: telegramWebhook
      tags: [telegram]
      summary: Receives Telegram Bot API updates (pre_checkout_query, successful_payment) to process Stars purchases
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramWebhookUpdate"
      responses:
        "200":
          description: Update processed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
